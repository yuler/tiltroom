name: watchOS TestFlight

on:
  workflow_call:
    inputs:
      version:
        description: 'Release version without leading v (e.g. 0.1.0)'
        required: true
        type: string
      ref:
        description: 'Git commit SHA or ref to build'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional version override (e.g. 0.1.0)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: watch-testflight
  cancel-in-progress: false

jobs:
  upload:
    name: Build & Upload watchOS to TestFlight
    runs-on: macos-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-tags: true

      - name: Verify watchOS project spec exists
        run: |
          if [ ! -f "watch/project.yml" ]; then
            echo "::error::watch/project.yml not found; scaffold the watchOS target before uploading to TestFlight."
            exit 1
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Check secrets
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          IOS_DEVELOPMENT_TEAM: ${{ secrets.IOS_DEVELOPMENT_TEAM }}
          IOS_DISTRIBUTION_CERT_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERT_P12_BASE64 }}
          IOS_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
        run: |
          for name in \
            APP_STORE_CONNECT_KEY_ID \
            APP_STORE_CONNECT_ISSUER_ID \
            APP_STORE_CONNECT_API_KEY_BASE64 \
            IOS_DEVELOPMENT_TEAM \
            IOS_DISTRIBUTION_CERT_P12_BASE64 \
            IOS_DISTRIBUTION_CERT_PASSWORD
          do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required secret: ${name}"
              exit 1
            fi
          done

      - name: Determine version and build number
        id: version
        shell: bash
        env:
          TILTROOM_VERSION: ${{ inputs.version || '' }}
        run: |
          source ./scripts/lib.sh
          load_app_version
          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$APP_BUILD" >> "$GITHUB_OUTPUT"
          echo "Building Tiltroom watchOS version: $APP_VERSION (build $APP_BUILD)"

      - name: Import signing certificate
        id: cert
        shell: bash
        env:
          IOS_DISTRIBUTION_CERT_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERT_P12_BASE64 }}
          IOS_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          printf '%s' "$IOS_DISTRIBUTION_CERT_P12_BASE64" | openssl base64 -d -A -out "$RUNNER_TEMP/distribution.p12"
          chmod 600 "$RUNNER_TEMP/distribution.p12"

          EXPECTED_WWDR_SHA256="dcf21878c77f4198e4b4614f03d696d89c66c66008d4244e1b99161aac91601f"
          curl -fsSL --proto '=https' --proto-redir '=https' --tlsv1.2 -o "$RUNNER_TEMP/AppleWWDRCAG3.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          ACTUAL_WWDR_SHA256="$(shasum -a 256 "$RUNNER_TEMP/AppleWWDRCAG3.cer" | awk '{print $1}')"
          if [ "$ACTUAL_WWDR_SHA256" != "$EXPECTED_WWDR_SHA256" ]; then
            echo "::error::AppleWWDRCAG3.cer SHA-256 mismatch: expected ${EXPECTED_WWDR_SHA256}, got ${ACTUAL_WWDR_SHA256}"
            exit 1
          fi

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/AppleWWDRCAG3.cer" -k "$KEYCHAIN_PATH" -T /usr/bin/codesign -T /usr/bin/security
          security import "$RUNNER_TEMP/distribution.p12" -k "$KEYCHAIN_PATH" -P "$IOS_DISTRIBUTION_CERT_PASSWORD" -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          EXISTING_KEYCHAINS=()
          while IFS= read -r kc; do
            kc="${kc#"${kc%%[![:space:]]*}"}"
            kc="${kc#\"}"
            kc="${kc%\"}"
            [ -n "$kc" ] && EXISTING_KEYCHAINS+=("$kc")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$KEYCHAIN_PATH" "${EXISTING_KEYCHAINS[@]}"
          security default-keychain -s "$KEYCHAIN_PATH"

          SIGN_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk -F'"' '/Apple Distribution:|iPhone Distribution:/ { print $2; exit }')"
          if [ -z "$SIGN_IDENTITY" ]; then
            echo "::error::No Apple Distribution signing identity found in imported keychain"
            security find-identity -v -p codesigning "$KEYCHAIN_PATH"
            exit 1
          fi
          CERT_SERIAL="$(security find-certificate -c "$SIGN_IDENTITY" -p "$KEYCHAIN_PATH" | openssl x509 -noout -serial | cut -d= -f2 | tr '[:lower:]' '[:upper:]' | sed 's/^0*//')"

          echo "sign_identity=$SIGN_IDENTITY" >> "$GITHUB_OUTPUT"
          echo "cert_serial=$CERT_SERIAL" >> "$GITHUB_OUTPUT"
          echo "Using signing identity: $SIGN_IDENTITY"

      - name: Prepare App Store Connect API key and asc CLI
        shell: bash
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$APP_STORE_CONNECT_API_KEY_BASE64" | openssl base64 -d -A -out "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"

          curl -fsSL https://asccli.sh/install | INSTALL_DIR="$HOME/.local/bin" bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          "$HOME/.local/bin/asc" auth login --bypass-keychain \
            --name "Tiltroom CI" \
            --key-id "$APP_STORE_CONNECT_KEY_ID" \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --private-key "$RUNNER_TEMP/AuthKey.p8"

      - name: Fetch and install App Store provisioning profiles
        id: signing
        shell: bash
        env:
          CERT_SERIAL: ${{ steps.cert.outputs.cert_serial }}
        run: |
          set -euo pipefail
          profile_uuid() {
            local output="$1"
            printf '%s\n' "$output" | sed -n 's/^uuid=//p'
          }

          CONTAINER_OUT="$(./scripts/ensure-appstore-profile.sh cc.yuler.tiltroom "Tiltroom App Store" "Tiltroom")"
          WATCH_OUT="$(./scripts/ensure-appstore-profile.sh cc.yuler.tiltroom.watchkitapp "Tiltroom Watch App Store" "Tiltroom Watch")"
          CONTAINER_UUID="$(profile_uuid "$CONTAINER_OUT")"
          WATCH_UUID="$(profile_uuid "$WATCH_OUT")"
          if [ -z "$CONTAINER_UUID" ] || [ -z "$WATCH_UUID" ]; then
            echo "::error::Failed to resolve App Store profile UUIDs"
            printf '%s\n' "$CONTAINER_OUT" "$WATCH_OUT"
            exit 1
          fi
          {
            echo "bundle_id=cc.yuler.tiltroom"
            echo "watch_bundle_id=cc.yuler.tiltroom.watchkitapp"
            echo "container_profile_uuid=$CONTAINER_UUID"
            echo "watch_profile_uuid=$WATCH_UUID"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare signing config and ExportOptions
        shell: bash
        env:
          IOS_DEVELOPMENT_TEAM: ${{ secrets.IOS_DEVELOPMENT_TEAM }}
          SIGN_IDENTITY: ${{ steps.cert.outputs.sign_identity }}
          BUNDLE_ID: ${{ steps.signing.outputs.bundle_id }}
          WATCH_BUNDLE_ID: ${{ steps.signing.outputs.watch_bundle_id }}
          CONTAINER_PROFILE_UUID: ${{ steps.signing.outputs.container_profile_uuid }}
          WATCH_PROFILE_UUID: ${{ steps.signing.outputs.watch_profile_uuid }}
        run: |
          set -euo pipefail
          cat > watch/Signing.xcconfig <<EOF
          CODE_SIGN_STYLE = Manual
          DEVELOPMENT_TEAM = ${IOS_DEVELOPMENT_TEAM}
          CODE_SIGN_IDENTITY = ${SIGN_IDENTITY}
          EOF

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>uploadSymbols</key>
            <true/>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>teamID</key>
            <string>${IOS_DEVELOPMENT_TEAM}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${CONTAINER_PROFILE_UUID}</string>
              <key>${WATCH_BUNDLE_ID}</key>
              <string>${WATCH_PROFILE_UUID}</string>
            </dict>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          EOF

      - name: Generate Xcode project
        env:
          TILTROOM_VERSION: ${{ steps.version.outputs.version }}
          CONTAINER_PROFILE_UUID: ${{ steps.signing.outputs.container_profile_uuid }}
          WATCH_PROFILE_UUID: ${{ steps.signing.outputs.watch_profile_uuid }}
        run: ./scripts/watch-xcodegen.sh

      - name: Archive and export IPA
        shell: bash
        env:
          IOS_DEVELOPMENT_TEAM: ${{ secrets.IOS_DEVELOPMENT_TEAM }}
          SIGN_IDENTITY: ${{ steps.cert.outputs.sign_identity }}
        run: |
          set -euo pipefail
          xcodebuild \
            -project watch/Tiltroom.xcodeproj \
            -scheme TiltroomContainer \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Tiltroom.xcarchive" \
            DEVELOPMENT_TEAM="$IOS_DEVELOPMENT_TEAM" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$SIGN_IDENTITY" \
            archive

          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/Tiltroom.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload IPA to TestFlight via asc CLI
        shell: bash
        env:
          ASC_APP_ID: ${{ vars.ASC_APP_ID }}
          BUNDLE_ID: ${{ steps.signing.outputs.bundle_id }}
        run: |
          set -euo pipefail
          IPA_PATH="$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' | head -n 1)"
          if [ -z "$IPA_PATH" ] || [ ! -f "$IPA_PATH" ]; then
            echo "::error::Exported IPA not found in $RUNNER_TEMP/export"
            ls -la "$RUNNER_TEMP/export"
            exit 1
          fi
          ls -lh "$IPA_PATH"

          APP_TARGET="${ASC_APP_ID:-$BUNDLE_ID}"
          for attempt in 1 2 3; do
            if asc builds upload \
              --app "$APP_TARGET" \
              --ipa "$IPA_PATH" \
              --platform IOS; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Failed to upload $IPA_PATH to App Store Connect after 3 attempts"
              exit 1
            fi
            echo "::warning::asc builds upload attempt ${attempt}/3 failed; retrying in 15s..."
            sleep 15
          done

      - name: Clean up signing materials
        if: always()
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" 2>/dev/null || true
          rm -rf \
            "$RUNNER_TEMP/distribution.p12" \
            "$RUNNER_TEMP/AuthKey.p8" \
            "$RUNNER_TEMP/AppleWWDRCAG3.cer" \
            "$RUNNER_TEMP/AppStore.mobileprovision" \
            "$HOME/.asc"
