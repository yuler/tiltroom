name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  script-tests:
    name: Script & Release Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Test release scripts
        run: node --test .github/scripts/*.test.mjs

      - name: Check shell scripts syntax
        run: bash -n scripts/*.sh

  web-build:
    name: Web Typecheck, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install web dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck web
        run: bun run typecheck

      - name: Test web
        run: bun run test

      - name: Build web
        run: bun run build

  detect-watch:
    name: Detect watchOS Project
    runs-on: ubuntu-latest
    outputs:
      has_watch_project: ${{ steps.check.outputs.has_watch_project }}
    steps:
      - uses: actions/checkout@v5
      - id: check
        run: |
          if [ -f "watch/project.yml" ]; then
            echo "has_watch_project=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_watch_project=false" >> "$GITHUB_OUTPUT"
          fi

  watch-build:
    name: watchOS Build & Test
    needs: detect-watch
    if: needs.detect-watch.outputs.has_watch_project == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-tags: true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: ./scripts/watch-xcodegen.sh

      - name: Build for watchOS Simulator
        run: |
          xcodebuild \
            -project watch/Tiltroom.xcodeproj \
            -scheme Tiltroom \
            -configuration Debug \
            -destination 'generic/platform=watchOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run watchOS unit tests
        shell: bash
        run: |
          set -euo pipefail
          SIM_UDID="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin).get("devices", {})
          candidates = []
          for runtime, devices in data.items():
            if "watchOS" not in runtime:
              continue
            for d in devices:
              if d.get("isAvailable"):
                candidates.append((runtime, d["name"], d["udid"]))
          candidates.sort(reverse=True)
          print(candidates[0][2] if candidates else "")
          ')"
          if [ -z "$SIM_UDID" ]; then
            echo "::error::No available watchOS Simulator found on runner"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Running TiltroomTests on watchOS Simulator UDID: $SIM_UDID"
          xcodebuild \
            -project watch/Tiltroom.xcodeproj \
            -scheme Tiltroom \
            -configuration Debug \
            -destination "platform=watchOS Simulator,id=$SIM_UDID" \
            CODE_SIGNING_ALLOWED=NO \
            test
