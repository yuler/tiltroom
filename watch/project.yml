name: Tiltroom
options:
  bundleIdPrefix: cc.yuler
  deploymentTarget:
    watchOS: "10.0"
  createIntermediateGroups: true
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.9"
targets:
  Tiltroom:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Tiltroom
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.yuler.tiltroom
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Tiltroom/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "${APP_VERSION}"
        CURRENT_PROJECT_VERSION: "${APP_BUILD}"
        SUPPORTED_PLATFORMS: "watchos watchsimulator"
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: "4"
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        SKIP_INSTALL: NO
  TiltroomTests:
    type: bundle.unit-test
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: TiltroomTests
    dependencies:
      - target: Tiltroom
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.yuler.tiltroom.tests
        GENERATE_INFOPLIST_FILE: YES
        SUPPORTED_PLATFORMS: "watchos watchsimulator"
        TARGETED_DEVICE_FAMILY: "4"
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
schemes:
  Tiltroom:
    build:
      targets:
        Tiltroom: all
    test:
      targets:
        - TiltroomTests
