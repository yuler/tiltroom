name: Tiltroom
options:
  bundleIdPrefix: cc.yuler
  deploymentTarget:
    watchOS: "10.0"
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.9"
targets:
  # Xcode 26 cannot export a bare watchOS archive to App Store Connect.
  # The watch-only template archives this iOS container and embeds the watch app under Watch/.
  TiltroomContainer:
    type: application.watchapp2-container
    platform: iOS
    deploymentTarget: "17.0"
    productName: Tiltroom
    dependencies:
      - target: Tiltroom
        embed: true
        copy:
          destination: productsDirectory
          subpath: "$(CONTENTS_FOLDER_PATH)/Watch"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.yuler.tiltroom
        PRODUCT_NAME: Tiltroom
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Tiltroom
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        MARKETING_VERSION: "${APP_VERSION}"
        CURRENT_PROJECT_VERSION: "${APP_BUILD}"
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SKIP_INSTALL: NO
        PROVISIONING_PROFILE_SPECIFIER: "${CONTAINER_PROFILE_UUID}"
  Tiltroom:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    productName: TiltroomWatch
    sources:
      - path: Tiltroom
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.yuler.tiltroom.watchkitapp
        PRODUCT_NAME: TiltroomWatch
        PRODUCT_MODULE_NAME: Tiltroom
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Tiltroom/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "${APP_VERSION}"
        CURRENT_PROJECT_VERSION: "${APP_BUILD}"
        SUPPORTED_PLATFORMS: "watchos watchsimulator"
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: "4"
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        PROVISIONING_PROFILE_SPECIFIER: "${WATCH_PROFILE_UUID}"
      configs:
        # Debug tests install and launch the watch app. Release archives only embed it.
        Debug:
          SKIP_INSTALL: NO
        Release:
          SKIP_INSTALL: YES
  TiltroomTests:
    type: bundle.unit-test
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: TiltroomTests
    dependencies:
      - target: Tiltroom
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.yuler.tiltroom.tests
        GENERATE_INFOPLIST_FILE: YES
        SUPPORTED_PLATFORMS: "watchos watchsimulator"
        TARGETED_DEVICE_FAMILY: "4"
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
schemes:
  Tiltroom:
    build:
      targets:
        Tiltroom: all
    test:
      targets:
        - TiltroomTests
  TiltroomContainer:
    build:
      targets:
        TiltroomContainer: all
    archive:
      config: Release
